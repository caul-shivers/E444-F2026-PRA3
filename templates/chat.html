{% extends "bootstrap/base.html" %}
{% block title %}Flasky Chat{% endblock %}

{% block navbar %}
  <div class="navbar navbar-inverse" role="navigation">
     <div class="container">
        <div class="navbar-header">
            <a class="navbar-brand" href="/">Flasky</a>
        </div>
     </div>
  </div>
{% endblock %}

{% block content %}
<div class="container">
    <div class="page-header">
        <h1>Chat with Flasky Bot</h1>
        <p>Hi {{ name }}! Ask me something below.</p>
        <a href="{{ url_for('logout') }}" class="btn btn-danger btn-sm">Logout</a>
    </div>

    <div id="chat-window"
         style="border:1px solid #ccc; border-radius:4px; padding:10px; height:300px; overflow-y:auto; margin-bottom:10px;">
    </div>

    <form id="chat-form" class="form-inline">
        <input type="text" id="message-input" class="form-control"
               placeholder="Type a message..." autocomplete="off" style="width:80%;">
        <button type="submit" class="btn btn-primary">Send</button>
    </form>
</div>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
document.getElementById('chat-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('message-input');
    var message = input.value.trim();
    if (!message) return;

    var chatWindow = document.getElementById('chat-window');
    chatWindow.innerHTML += '<p><strong>You:</strong> ' + message + '</p>';
    input.value = '';
    chatWindow.scrollTop = chatWindow.scrollHeight;

    fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message })
    })
    .then(function (response) { return response.json(); })
    .then(function (data) {
        chatWindow.innerHTML += '<p><strong>Bot:</strong> ' + data.reply + '</p>';
        chatWindow.scrollTop = chatWindow.scrollHeight;
    });
});
</script>
{% endblock %}
